name: Prepare data release

on:
  workflow_dispatch:
    inputs:
      baseline_counts:
        description: 'Previously inspected counts JSON: orbital_records, discovery_records, master_records, known_discovery'
        required: true
        type: string
      selected_limits:
        description: 'First-N discovery profiles, comma-separated; full profile is always included'
        required: true
        default: '100000'
        type: string
      allow_count_decrease:
        description: 'Accept a count reduction only after inspecting the changed sources'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: prepare-data-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -v
      - name: Verify producer checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
      - name: Refresh, build, export and verify bundle
        id: prepare
        env:
          RELEASE_PRODUCER_COMMIT: ${{ github.sha }}
          RELEASE_BASELINE_COUNTS: ${{ inputs.baseline_counts }}
          RELEASE_SELECTED_LIMITS: ${{ inputs.selected_limits }}
          RELEASE_ALLOW_COUNT_DECREASE: ${{ inputs.allow_count_decrease }}
        run: python scripts/prepare_release_workflow.py
      - name: Retain candidate for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare.outputs.release_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.bundle }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

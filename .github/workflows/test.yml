name: Test pipeline
on:
  # Branch pushes are covered by their pull request; testing both ran every suite twice.
  push:
    branches: [master]
  pull_request:
  # Run on demand for a branch without a pull request.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Groups are repository-wide, so the workflow name keeps them from clashing with
  # other workflows. Only runs for the same pull request share a group, so a newer
  # push cancels the unfinished run. Master and manual runs get their own group and
  # always complete.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: orrery-data --version
      - run: python -m unittest discover -s tests -v
      - run: python -m orrery_data verify-browser --directory data
        if: matrix.python == '3.13'
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run test:browser
        env:
          FULL_BROWSER_DATA: data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-delivery-checks
          path: .context/browser-checks

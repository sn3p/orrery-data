[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orrery-data"
version = "0.4.0"
description = "Reproducible MPC snapshots and static catalogs for Orrery"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
orrery-data = "orrery_data.cli:main"

[tool.setuptools.packages.find]
include = ["orrery_data*"]

[tool.setuptools.package-data]
orrery_data = ["NOTICE.txt"]
